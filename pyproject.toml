[project]
name = "vllm-nano"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "contextvars>=2.4",
    "loguru>=0.7.3",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "torch==2.14.1",
    "transformers==5.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_nano"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes. I: import order. UP: modern syntax. B: likely bugs.
# SIM: simplifications. Keep this list short and defensible; add rules when they bite.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "slow: downloads a real model and takes ~20s; run with `pytest -m slow`",
]
