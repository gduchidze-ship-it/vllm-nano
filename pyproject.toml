[project]
name = "vllm-nano"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.3",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "torch==2.14.1",
    "transformers==5.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_nano"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
